<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'72','Helvetica Neue',Arial,sans-serif;background:#f5f6f8;color:#32363a;font-size:14px;}
.header{background:linear-gradient(135deg,#354a5e 0%,#0070f2 100%);color:#fff;padding:20px 32px;}
.header h1{font-size:22px;font-weight:700;}
.header .sub{font-size:13px;opacity:.8;margin-top:4px;}
.tab-bar-wrap{background:#fff;border-bottom:2px solid #e5e5e5;overflow-x:auto;white-space:nowrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.tab-bar{display:inline-flex;padding:0 16px;}
.tab-btn{display:inline-block;padding:13px 16px;font-size:13px;font-weight:600;color:#6a6d70;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:#0070f2;}
.tab-btn.active{color:#0070f2;border-bottom-color:#0070f2;}
.panel{display:none;padding:28px 32px;max-width:1400px;margin:0 auto;}
.panel.active{display:block;}
.kpi-row{display:flex;gap:18px;margin-bottom:28px;flex-wrap:wrap;}
.kpi-card{background:#fff;border-radius:10px;padding:20px 24px;flex:1;min-width:180px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-top:4px solid #0070f2;}
.kpi-card.gold{border-top-color:#f0ab00;}
.kpi-card .lbl{font-size:11px;color:#6a6d70;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.kpi-card .val{font-size:36px;font-weight:700;color:#354a5e;line-height:1;}
.kpi-card .sub{font-size:12px;color:#6a6d70;margin-top:5px;}
.kpi-card .trend{font-size:12px;margin-top:4px;font-weight:600;}
.trend-up{color:#107e3e;} .trend-down{color:#bb0000;}
.section-title{font-size:15px;font-weight:700;color:#354a5e;margin-bottom:14px;margin-top:4px;border-left:4px solid #0070f2;padding-left:12px;}
.chart-row{display:flex;gap:24px;margin-bottom:28px;flex-wrap:wrap;}
.chart-box{flex:1;min-width:300px;background:#fff;border-radius:10px;padding:22px;box-shadow:0 1px 6px rgba(0,0,0,.08);}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:28px;}
thead th{background:#354a5e;color:#fff;padding:13px 16px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{background:#0070f2;}
thead th.sorted{background:#0070f2;}
tbody tr:nth-child(even){background:#f9fafc;}
tbody tr:hover{background:#e8f1fd;}
tbody td{padding:10px 14px;font-size:14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;}
td.num{text-align:right;font-weight:700;color:#354a5e;font-size:15px;font-variant-numeric:tabular-nums;}
td.rank{text-align:center;color:#9e9e9e;font-size:13px;width:40px;}
.link-cell{max-width:400px;}
.link-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px;}
a.pl{color:#0070f2;text-decoration:none;}
a.pl:hover{text-decoration:underline;}
.bar{display:block;height:7px;border-radius:4px;background:#0070f2;margin-top:5px;transition:width .3s;}
.cat-stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.cat-kpi{background:#fff;border-radius:8px;padding:12px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #f0ab00;}
.cat-kpi .lbl{font-size:11px;color:#6a6d70;text-transform:uppercase;}
.cat-kpi .val{font-size:26px;font-weight:700;color:#354a5e;}
.hint{font-size:12px;color:#6a6d70;margin-bottom:8px;}
</style>
</head>

const D = DATA;
function fmt(n){return n?Number(n).toLocaleString():'<span style="color:#ccc;font-weight:400">0</span>';}

function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('p_'+id);
  if(panel) panel.classList.add('active');
  const btn = document.querySelector('[data-tab="'+id+'"]');
  if(btn) btn.classList.add('active');
  if(id !== 'overview') renderCat(id);
}

// Build category tabs
const tabBar = document.getElementById('tabBar');
D.categories.forEach(cat=>{
  const id = cat.replace(/[^a-zA-Z0-9]/g,'_');
  const btn = document.createElement('button');
  btn.className='tab-btn'; btn.textContent=cat;
  btn.dataset.tab=id;
  btn.onclick=()=>showTab(id);
  tabBar.appendChild(btn);
  const panel = document.createElement('div');
  panel.id='p_'+id; panel.className='panel';
  document.body.appendChild(panel);
});

// KPIs
const totals = D.monthly_totals;
const last = totals[totals.length-1];
const prev = totals.length>1 ? totals[totals.length-2] : null;
function trendBadge(cur, prv){
  if(!prv) return '';
  const pct = Math.round((cur-prv)/prv*100);
  const cls = pct>=0?'trend-up':'trend-down';
  const arrow = pct>=0?'▲':'▼';
  return '<div class="trend '+cls+'">'+arrow+' '+Math.abs(pct)+'% vs prev month</div>';
}
const allV = totals.reduce((s,r)=>s+r.views,0);
const allU = totals.reduce((s,r)=>s+r.uu,0);

document.getElementById('kpiRow').innerHTML = [
  ['Total Views ('+D.last_label+')', fmt(last.views), 'Page views this month', trendBadge(last.views, prev?prev.views:null), ''],
  ['Unique Users ('+D.last_label+')', fmt(last.uu), 'Unique visitors this month', trendBadge(last.uu, prev?prev.uu:null), 'gold'],
  ['All-Time Views', fmt(allV), 'Across '+totals.length+' months', '', ''],
  ['All-Time Unique Users', fmt(allU), 'Cumulative all months', '', ''],
].map(([lbl,val,sub,trend,cls])=>
  '<div class="kpi-card '+cls+'"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div>'+trend+'</div>'
).join('');

// Charts
function makeBar(id, label, getter, color){
  new Chart(document.getElementById(id),{
    type:'bar',
    data:{
      labels: totals.map(r=>r.month_label),
      datasets:[{
        label: label,
        data: totals.map(getter),
        backgroundColor: totals.map((_,i)=> i===totals.length-1 ? color : color+'88'),
        borderRadius:6, borderSkipped:false
      }]
    },
    options:{responsive:true,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>fmt(ctx.raw)+' '+label}}},
      scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}
    }
  });
}
makeBar('chartViews','Views',r=>r.views,'#0070f2');
makeBar('chartUU','Unique Users',r=>r.uu,'#f0ab00');

// Top pages table
const maxV = Math.max(...D.top_aspx.map(r=>r.views));
document.getElementById('topBody').innerHTML = D.top_aspx.map((r,i)=>
  '<tr><td class="rank">'+(i+1)+'</td><td class="link-cell">'+
  '<a class="pl link-title" href="'+r.url+'" target="_blank" title="'+r.title+'">'+r.title+'</a>'+
  '<span class="bar" style="width:'+Math.round(r.views/maxV*300)+'px"></span></td>'+
  '<td class="num">'+fmt(r.views)+'</td><td class="num">'+fmt(r.uu)+'</td></tr>'
).join('');

// Sort state per category
const sortState = {};

function renderCat(id){
  const panel = document.getElementById('p_'+id);
  if(panel.dataset.rendered) return;
  const cat = D.categories.find(c=>c.replace(/[^a-zA-Z0-9]/g,'_')===id);
  const rows = D.category_data[cat] || [];
  const tv = rows.reduce((s,r)=>s+r.views,0);
  const tu = rows.reduce((s,r)=>s+r.uu,0);
  sortState[id] = {col:'views', dir:-1};

  panel.innerHTML =
    '<div class="cat-stats">'+
    '<div class="cat-kpi"><div class="lbl">Assets</div><div class="val">'+rows.length+'</div></div>'+
    '<div class="cat-kpi"><div class="lbl">Views ('+D.last_label+')</div><div class="val">'+fmt(tv)+'</div></div>'+
    '<div class="cat-kpi"><div class="lbl">Unique Users ('+D.last_label+')</div><div class="val">'+fmt(tu)+'</div></div>'+
    '</div>'+
    '<div class="hint">Click column header to sort</div>'+
    '<table><thead><tr>'+
    '<th>#</th><th>Asset Title</th>'+
    '<th onclick="sortCat(\''+id+'\',\'views\')" class="sorted" id="th_'+id+'_views">Views ('+D.last_label+') ▼</th>'+
    '<th onclick="sortCat(\''+id+'\',\'uu\')" id="th_'+id+'_uu">Unique Users ('+D.last_label+') ↕</th>'+
    '<th onclick="sortCat(\''+id+'\',\'views_prev\')" id="th_'+id+'_views_prev">Views ('+D.prev_label+') ↕</th>'+
    '<th onclick="sortCat(\''+id+'\',\'views_first\')" id="th_'+id+'_views_first">Views ('+D.first_label+') ↕</th>'+
    '</tr></thead>'+
    '<tbody id="tb_'+id+'"></tbody></table>';

  drawCatRows(id);
  panel.dataset.rendered = '1';
}

function drawCatRows(id){
  const cat = D.categories.find(c=>c.replace(/[^a-zA-Z0-9]/g,'_')===id);
  const rows = D.category_data[cat] || [];
  const s = sortState[id];
  const sorted = [...rows].sort((a,b)=> s.dir*(b[s.col]-a[s.col]));
  const maxV = Math.max(...sorted.map(r=>r.views),1);
  document.getElementById('tb_'+id).innerHTML = sorted.map((r,i)=>
    '<tr><td class="rank">'+(i+1)+'</td>'+
    '<td class="link-cell"><a class="pl link-title" href="'+r.url+'" target="_blank" title="'+r.title+'">'+r.title+'</a>'+
    '<span class="bar" style="width:'+Math.round(r.views/maxV*300)+'px"></span></td>'+
    '<td class="num">'+fmt(r.views)+'</td>'+
    '<td class="num">'+fmt(r.uu)+'</td>'+
    '<td class="num">'+fmt(r.views_prev)+'</td>'+
    '<td class="num">'+fmt(r.views_first)+'</td></tr>'
  ).join('');
}

function sortCat(id, col){
  const s = sortState[id];
  if(s.col===col) s.dir*=-1; else{s.col=col; s.dir=-1;}
  ['views','uu','views_prev','views_first'].forEach(c=>{
    const th = document.getElementById('th_'+id+'_'+c);
    if(th){ th.classList.remove('sorted'); th.textContent=th.textContent.replace(/[▼▲↕]/,'↕'); }
  });
  const active = document.getElementById('th_'+id+'_'+col);
  if(active){ active.classList.add('sorted'); active.textContent=active.textContent.replace(/[▼▲↕]/,s.dir===-1?'▼':'▲'); }
  drawCatRows(id);
}

</script>
