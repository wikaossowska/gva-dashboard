<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVA SharePoint Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=72:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue-2: #D1EFFF;
  --blue-4: #89D1FF;
  --blue-6: #1B90FF;
  --blue-7: #0070F2;
  --blue-10: #002A86;
  --blue-11: #00144A;
  --gold: #F0AB00;
  --gold-light: #FFF3CC;
  --white: #FFFFFF;
  --black: #000000;
  --grey-1: #F5F6F8;
  --grey-2: #EDEFF2;
  --grey-text: #556068;
  --success: #107E3E;
  --danger: #BB0000;
  --radius: 12px;
  --shadow: 0 2px 16px rgba(0,40,130,0.10);
  --shadow-lg: 0 8px 40px rgba(0,40,130,0.15);
  --font: '72', 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--grey-1);
  color: #2A2D36;
  font-size: 14px;
  min-height: 100vh;
}

/* ─── HEADER ─── */
.header {
  background: linear-gradient(135deg, var(--blue-11) 0%, var(--blue-10) 45%, var(--blue-7) 100%);
  color: var(--white);
  padding: 0 32px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(27,144,255,0.25) 0%, transparent 70%);
  pointer-events: none;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 20%;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(240,171,0,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  position: relative;
  z-index: 1;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.sap-logo {
  width: 44px; height: 24px;
  background: var(--white);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: var(--blue-10);
  letter-spacing: 1px;
  flex-shrink: 0;
}
.header-title h1 {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.1;
}
.header-title .sub {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 2px;
  letter-spacing: 0.4px;
}
.header-meta {
  display: flex;
  align-items: center;
  gap: 24px;
}
.header-stat {
  text-align: right;
}
.header-stat .hs-val {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}
.header-stat .hs-lbl {
  font-size: 10px;
  opacity: 0.65;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  margin-top: 2px;
}
.header-divider {
  width: 1px;
  height: 36px;
  background: rgba(255,255,255,0.2);
}

/* ─── TAB BAR ─── */
.tab-bar-wrap {
  background: var(--white);
  border-bottom: 1px solid var(--grey-2);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,40,130,0.07);
}
.tab-bar-scroll {
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
.tab-bar-scroll::-webkit-scrollbar { display: none; }
.tab-bar {
  display: inline-flex;
  padding: 0 24px;
}
.tab-btn {
  display: inline-block;
  padding: 14px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--grey-text);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  transition: all 0.18s;
  white-space: nowrap;
  font-family: var(--font);
}
.tab-btn:hover { color: var(--blue-7); }
.tab-btn.active {
  color: var(--blue-7);
  border-bottom-color: var(--blue-7);
}

/* ─── DROPDOWN TABS ─── */
.tab-dropdown {
  position: relative;
  display: inline-block;
}
.tab-dropdown-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 14px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--grey-text);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  transition: all 0.18s;
  white-space: nowrap;
  font-family: var(--font);
}
.tab-dropdown-btn:hover { color: var(--blue-7); }
.tab-dropdown-btn.active { color: var(--blue-7); border-bottom-color: var(--blue-7); }
.tab-dropdown-arrow { font-size: 8px; transition: transform 0.15s; opacity: 0.6; }
.tab-dropdown.open .tab-dropdown-arrow { transform: rotate(180deg); }
.tab-dropdown-menu {
  display: none;
  position: fixed;
  background: var(--white);
  border: 1px solid var(--grey-2);
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,40,130,0.14);
  min-width: 210px;
  z-index: 9999;
  padding: 6px 0;
}
.tab-dropdown.open .tab-dropdown-menu { display: block; }
.tab-dropdown-item {
  display: block;
  width: 100%;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  color: #2A2D36;
  cursor: pointer;
  border: none;
  background: none;
  text-align: left;
  font-family: var(--font);
  transition: background 0.1s, color 0.1s;
  white-space: nowrap;
}
.tab-dropdown-item:hover { background: #EBF2FF; color: var(--blue-7); }
.tab-dropdown-item.active { color: var(--blue-7); font-weight: 700; background: #F0F7FF; }

/* ─── PANELS ─── */
.panel { display: none; padding: 28px 32px; max-width: 1440px; margin: 0 auto; }
.panel.active { display: block; }

/* ─── KPI ROW ─── */
.kpi-row { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.kpi-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px 24px;
  flex: 1;
  min-width: 190px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
}
.kpi-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--blue-7);
  border-radius: var(--radius) var(--radius) 0 0;
}
.kpi-card.gold::before { background: var(--gold); }
.kpi-card.navy::before { background: var(--blue-10); }
.kpi-card.teal::before { background: #00A19A; }
.kpi-card .kpi-icon {
  position: absolute;
  top: 16px; right: 20px;
  font-size: 22px;
  opacity: 0.12;
}
.kpi-card .lbl {
  font-size: 10px;
  color: var(--grey-text);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin-bottom: 8px;
  font-weight: 600;
}
.kpi-card .val {
  font-size: 34px;
  font-weight: 700;
  color: var(--blue-11);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.kpi-card .sub {
  font-size: 11px;
  color: var(--grey-text);
  margin-top: 6px;
}
.kpi-card .trend {
  font-size: 12px;
  font-weight: 700;
  margin-top: 5px;
}
.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }

/* ─── SECTION TITLE ─── */
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--blue-11);
  margin-bottom: 14px;
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.1px;
}
.section-title::before {
  content: '';
  display: block;
  width: 4px;
  height: 18px;
  background: linear-gradient(180deg, var(--blue-7), var(--blue-10));
  border-radius: 2px;
  flex-shrink: 0;
}

/* ─── CHART ROW ─── */
.chart-row { display: flex; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.chart-box {
  flex: 1;
  min-width: 300px;
  background: var(--white);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.chart-box .section-title { margin-bottom: 18px; }

/* ─── SEARCH + EXPORT BAR ─── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 420px;
}
.search-wrap input {
  width: 100%;
  height: 38px;
  border: 1.5px solid var(--grey-2);
  border-radius: 8px;
  padding: 0 12px 0 36px;
  font-size: 13px;
  font-family: var(--font);
  color: #2A2D36;
  background: var(--white);
  transition: border-color 0.15s;
  outline: none;
}
.search-wrap input:focus { border-color: var(--blue-7); }
.search-wrap input::placeholder { color: #AAB0B8; }
.search-wrap .search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  opacity: 0.4;
}
.btn-export {
  height: 38px;
  padding: 0 18px;
  background: var(--blue-7);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn-export:hover { background: var(--blue-10); transform: translateY(-1px); }
.btn-export:active { transform: translateY(0); }
.filter-count {
  font-size: 12px;
  color: var(--grey-text);
  margin-left: 4px;
}

/* ─── TABLE ─── */
.table-wrap {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 28px;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--blue-11);
  color: var(--white);
  padding: 12px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: background 0.15s;
}
thead th:hover { background: var(--blue-10); }
thead th.sorted { background: var(--blue-7); }
thead th:first-child { cursor: default; width: 44px; text-align: center; }
tbody tr:nth-child(even) { background: #F8FAFF; }
tbody tr:hover { background: #EBF2FF; }
tbody td {
  padding: 10px 16px;
  font-size: 13px;
  border-bottom: 1px solid #F0F3FA;
  vertical-align: middle;
}
td.num {
  text-align: right;
  font-weight: 700;
  color: var(--blue-11);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
td.rank {
  text-align: center;
  color: #9EA8B3;
  font-size: 12px;
  font-weight: 600;
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
}
.rank-1 { background: #FFD700; color: #554400; }
.rank-2 { background: #C0C0C0; color: #333; }
.rank-3 { background: #CD7F32; color: #fff; }
.link-cell { max-width: 360px; }
.link-title {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 340px;
  color: var(--blue-7);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.link-title:hover { text-decoration: underline; }
.bar-mini {
  display: block;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--blue-6), var(--blue-7));
  margin-top: 5px;
  opacity: 0.7;
  transition: width 0.4s;
}
.no-results {
  text-align: center;
  padding: 40px;
  color: var(--grey-text);
  font-size: 14px;
}

/* ─── CATEGORY KPIs ─── */
.cat-stats {
  display: flex;
  gap: 14px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.cat-kpi {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 20px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--gold);
  min-width: 150px;
}
.cat-kpi .lbl {
  font-size: 10px;
  color: var(--grey-text);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  font-weight: 600;
}
.cat-kpi .val {
  font-size: 26px;
  font-weight: 700;
  color: var(--blue-11);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

/* ─── HINT ─── */
.hint {
  font-size: 11px;
  color: var(--grey-text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hint::before { content: 'ℹ'; font-size: 13px; }

/* ─── EMPTY STATE ─── */
.empty-panel {
  text-align: center;
  padding: 60px 20px;
  color: var(--grey-text);
}
.empty-panel .ei { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #C8D0E0; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--blue-7); }

/* ─── RESPONSIVE ─── */
@media (max-width: 700px) {
  .panel { padding: 16px; }
  .header-meta { display: none; }
  .header { padding: 0 16px; }
}
</style>
</head>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="sap-logo">SAP</div>
      <div class="header-title">
        <h1>GVA Analytics</h1>
        <div class="sub">Global Value Advisory &nbsp;·&nbsp; SharePoint Usage Dashboard</div>
      </div>
    </div>
    <div class="header-meta" id="headerMeta"></div>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar-wrap">
  <div class="tab-bar-scroll">
    <div class="tab-bar" id="tabBar">

    </div>

</div>

<!-- OVERVIEW PANEL -->
<div id="p_overview" class="panel active">
  <div class="kpi-row" id="kpiRow"></div>

    <div class="chart-box">
      <div class="section-title">Total Views per Month</div>

      <canvas id="chartUU" height="120"></canvas>

  </div>
  <div class="section-title">Most Visited SitePages &mdash; Last Month</div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6.5" cy="6.5" r="5" stroke="#2A2D36" stroke-width="1.5"/>
        <path d="M10 10L14 14" stroke="#2A2D36" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="overviewSearch" placeholder="Search pages…" oninput="filterOverview(this.value)">
    </div>
    <button class="btn-export" onclick="exportOverviewCSV()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export CSV
    </button>
    <span class="filter-count" id="overviewCount"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="ovThead"></thead>
      <tbody id="topBody"></tbody>
    </table>
  </div>
</div>

// ─── SHOW TAB ───
function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-dropdown-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-dropdown-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-dropdown').forEach(d=>d.classList.remove('open'));
  const panel = document.getElementById('p_'+id);
  if(panel) panel.classList.add('active');
  // flat tab button
  const flatBtn = document.querySelector('.tab-btn[data-tab="'+id+'"]');
  if(flatBtn) flatBtn.classList.add('active');
  // dropdown item + parent dropdown button
  const dropItem = document.querySelector('.tab-dropdown-item[data-tab="'+id+'"]');
  if(dropItem){
    dropItem.classList.add('active');
    const dropBtn = dropItem.closest('.tab-dropdown').querySelector('.tab-dropdown-btn');
    if(dropBtn) dropBtn.classList.add('active');
  }
  if(id !== 'overview') renderCat(id);
}

  {label:'Who We Are', cats:['Who We Are (home)','Who We Are (Home)','Our Team / Our Work','Our Team','Our Work']},
  {label:'Business Applications', cats:['Spend','Finance','Supply Chain','Human Capital Management','Cloud ERP','RISE with SAP']},
  {label:'Technology & Data', cats:['Technology & Data','Business AI','Business Data Cloud','Business Technology Platform','Business Transformation Management','Business Suite']},
  {label:'Tools', cats:['Customer Strategy Explorer','Executive Value Brief','Customer Value Explorer','Strategic Conversations Guide','Executive Value Brief & Customer Strategy Explorer','Move the Needle','Value Starter','Value One-Pager','FLASH','Performance Benchmarking','Guided Business Case']}
];

function catToId(cat){ return cat.replace(/[^a-zA-Z0-9]/g,'_'); }

// build a Set of all grouped cats for quick lookup
const groupedCats = new Set();
TAB_GROUPS.forEach(g=>g.cats.forEach(c=>groupedCats.add(c)));

const tabBar = document.getElementById('tabBar');

// 1. Add grouped dropdowns
TAB_GROUPS.forEach(function(group){
  // only render group if at least one cat exists in data
  const existingCats = group.cats.filter(c=>D.categories.indexOf(c)!==-1);
  if(existingCats.length===0) return;

  const wrap = document.createElement('div');
  wrap.className='tab-dropdown';

  const btn = document.createElement('button');
  btn.className='tab-dropdown-btn';
  btn.innerHTML=group.label+'<span class="tab-dropdown-arrow">&#9660;</span>';

  const menu = document.createElement('div');
  menu.className='tab-dropdown-menu';

  var hoverTimer;
  wrap.addEventListener('mouseenter', function(){
    clearTimeout(hoverTimer);
    document.querySelectorAll('.tab-dropdown').forEach(d=>d.classList.remove('open'));
    wrap.classList.add('open');
    var rect = btn.getBoundingClientRect();
    menu.style.top = (rect.bottom + 2) + 'px';
    menu.style.left = rect.left + 'px';
  });
  wrap.addEventListener('mouseleave', function(){
    hoverTimer = setTimeout(function(){ wrap.classList.remove('open'); }, 150);
  });
  menu.addEventListener('mouseenter', function(){ clearTimeout(hoverTimer); });
  menu.addEventListener('mouseleave', function(){
    hoverTimer = setTimeout(function(){ wrap.classList.remove('open'); }, 150);
  });
  btn.onclick=function(e){
    e.stopPropagation();
    const isOpen = wrap.classList.contains('open');
    document.querySelectorAll('.tab-dropdown').forEach(d=>d.classList.remove('open'));
    if(!isOpen){
      wrap.classList.add('open');
      var rect = btn.getBoundingClientRect();
      menu.style.top = (rect.bottom + 2) + 'px';
      menu.style.left = rect.left + 'px';
    }
  };
  wrap.appendChild(btn);

  existingCats.forEach(function(cat){
    const id = catToId(cat);
    const item = document.createElement('button');
    item.className='tab-dropdown-item';
    item.textContent=cat;
    item.dataset.tab=id;
    item.onclick=function(e){
      e.stopPropagation();
      document.querySelectorAll('.tab-dropdown').forEach(d=>d.classList.remove('open'));
      showTab(id);
    };
    menu.appendChild(item);

    const panel = document.createElement('div');
    panel.id='p_'+id; panel.className='panel';
    document.body.appendChild(panel);
  });

  wrap.appendChild(menu);
  tabBar.appendChild(wrap);
});

// 2. Add unassigned categories as flat tab-btn
D.categories.forEach(function(cat){
  if(groupedCats.has(cat)) return;
  const id = catToId(cat);
  const btn = document.createElement('button');
  btn.className='tab-btn'; btn.textContent=cat;
  btn.dataset.tab=id;
  btn.onclick=function(){ showTab(id); };
  tabBar.appendChild(btn);

  const panel = document.createElement('div');
  panel.id='p_'+id; panel.className='panel';
  document.body.appendChild(panel);
});

// Close dropdowns on outside click
document.addEventListener('click',function(){
  document.querySelectorAll('.tab-dropdown').forEach(d=>d.classList.remove('open'));
});

// ─── KPIs ───
function trendBadge(cur, prv){
  if(!prv) return '';
  const pct = Math.round((cur-prv)/prv*100);
  const cls = pct>=0?'trend-up':'trend-down';
  const arrow = pct>=0?'▲':'▼';
  return '<div class="trend '+cls+'">'+arrow+' '+Math.abs(pct)+'% vs prev month</div>';
}

document.getElementById('kpiRow').innerHTML = [
  ['Total Views', last.views.toLocaleString(), D.month_labels[D.month_labels.length-1], trendBadge(last.views, prev?prev.views:null), '', '&#128202;'],
  ['Unique Users', last.uu.toLocaleString(), D.month_labels[D.month_labels.length-1], trendBadge(last.uu, prev?prev.uu:null), 'gold', '&#128101;'],
  ['All-Time Views', allV.toLocaleString(), totals.length+' months tracked', '', 'navy', '&#128200;'],
  ['All-Time Users', allU.toLocaleString(), 'Cumulative unique', '', 'teal', '&#127760;'],
].map(function(a){
  var lbl=a[0],val=a[1],sub=a[2],trend=a[3],cls=a[4],icon=a[5];
  return '<div class="kpi-card '+cls+'"><span class="kpi-icon">'+icon+'</span><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div>'+trend+'</div>';
}).join('');

// ─── CHARTS ───
Chart.defaults.font.family = "'72', 'Helvetica Neue', Arial, sans-serif";
Chart.defaults.font.size = 12;

function makeChart(id, label, getter, color){
  const ctx = document.getElementById(id).getContext('2d');
  const reversedTotals = totals.slice().reverse();
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: reversedTotals.map(r=>r.month_label),
      datasets: [{
        label: label,
        data: reversedTotals.map(getter),
        backgroundColor: reversedTotals.map((_,i)=> i===0 ? color : color+'99'),
        borderRadius: 8,
        borderSkipped: false,
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#00144A',
          titleFont: { weight: 700 },
          callbacks: { label: function(ctx){ return ctx.raw.toLocaleString()+' '+label; } }
        }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: '#F0F3FA' }, ticks: { color: '#9EA8B3' } },
        x: { grid: { display: false }, ticks: { color: '#556068' } }
      }
    }
  });
}
makeChart('chartViews','Views',function(r){return r.views;},'#0070F2');
makeChart('chartUU','Unique Users',function(r){return r.uu;},'#F0AB00');

// ─── TOP PAGES TABLE ───
const overviewData = D.top_aspx;
let overviewFiltered = overviewData.slice();
var ovSort = {col:'views', idx:D.month_labels.length-1, dir:1};

function buildOverviewHead(){
  var n = D.month_labels.length;
  var mhCells = '<th rowspan="2" style="width:44px;text-align:center;cursor:default">#</th><th rowspan="2">Page Title</th>';
  monthOrder.forEach(function(mi){
    var bdr = mi>0 ? ' style="border-right:2px solid rgba(255,255,255,0.15)"' : '';
    mhCells += '<th colspan="2"'+bdr+'>'+D.month_labels[mi]+'</th>';
  });
  var chCells = '';
  monthOrder.forEach(function(mi){
    var bdr = mi>0 ? ' style="border-right:2px solid rgba(255,255,255,0.1)"' : '';
    chCells += '<th onclick="sortOverview(\'views\','+mi+')" id="ovthv_'+mi+'" style="cursor:pointer">Views &#x21D5;</th>';
    chCells += '<th onclick="sortOverview(\'uu\','+mi+')" id="ovthu_'+mi+'" style="cursor:pointer"'+bdr+'>UU &#x21D5;</th>';
  });
  document.getElementById('ovThead').innerHTML =
    '<tr style="background:var(--blue-11);color:#fff">'+mhCells+'</tr>'+
    '<tr style="background:var(--blue-10);color:#fff">'+chCells+'</tr>';
  // show default sort indicator
  var defTh = document.getElementById('ovthv_'+(D.month_labels.length-1));
  if(defTh){ defTh.classList.add('sorted'); defTh.innerHTML='Views &#x25BC;'; }
}

function renderOverview(rows){
  var n = D.month_labels.length;
  var maxV = Math.max.apply(null, overviewData.map(r=>r.views[n-1]).concat([1]));
  var totalCols = 2 + n*2;
  if(!rows.length){
    document.getElementById('topBody').innerHTML = '<tr><td colspan="'+totalCols+'" class="no-results">No pages match your search.</td></tr>';
    document.getElementById('overviewCount').textContent = '';
    return;
  }
  document.getElementById('overviewCount').textContent = rows.length < overviewData.length ? 'Showing '+rows.length+' of '+overviewData.length : rows.length+' pages';
  document.getElementById('topBody').innerHTML = rows.map(function(r,i){
    var rankEl = i<3 ? '<span class="rank-badge rank-'+(i+1)+'">'+(i+1)+'</span>' : '<span style="color:#9EA8B3;font-weight:600">'+(i+1)+'</span>';
    var cells = '';
    monthOrder.forEach(function(mi){
      var bdr = mi>0 ? ' style="border-right:1px solid #e8edf8"' : '';
      cells += '<td class="num">'+fmt(r.views[mi])+'</td><td class="num"'+bdr+'>'+fmt(r.uu[mi])+'</td>';
    });
    return '<tr>'+
      '<td class="rank">'+rankEl+'</td>'+
      '<td class="link-cell">'+
        '<a class="link-title" href="'+r.url+'" target="_blank" title="'+r.title+'">'+r.title+'</a>'+
        '<span class="bar-mini" style="width:'+Math.round(r.views[n-1]/maxV*280)+'px"></span>'+
      '</td>'+cells+'</tr>';
  }).join('');
}

function sortOverview(col, idx){
  if(ovSort.col===col && ovSort.idx===idx) ovSort.dir*=-1; else{ovSort.col=col; ovSort.idx=idx; ovSort.dir=1;}
  overviewFiltered.sort(function(a,b){
    var va = col==='views'?a.views[idx]:a.uu[idx];
    var vb = col==='views'?b.views[idx]:b.uu[idx];
    return ovSort.dir*(vb-va);
  });
  D.month_labels.forEach(function(_,mi){
    var tv=document.getElementById('ovthv_'+mi), tu=document.getElementById('ovthu_'+mi);
    if(tv){tv.classList.remove('sorted');tv.innerHTML='Views &#x21D5;';}
    if(tu){tu.classList.remove('sorted');tu.innerHTML='UU &#x21D5;';}
  });
  var active=document.getElementById((col==='views'?'ovthv_':'ovthu_')+idx);
  if(active){active.classList.add('sorted');active.innerHTML=(col==='views'?'Views':'UU')+' '+(ovSort.dir===1?'&#x25BC;':'&#x25B2;');}
  renderOverview(overviewFiltered);
}

function filterOverview(q){
  overviewFiltered = q ? overviewData.filter(r=>r.title.toLowerCase().includes(q.toLowerCase())) : overviewData.slice();
  overviewFiltered.sort(function(a,b){
    var va=ovSort.col==='views'?a.views[ovSort.idx]:a.uu[ovSort.idx];
    var vb=ovSort.col==='views'?b.views[ovSort.idx]:b.uu[ovSort.idx];
    return ovSort.dir*(vb-va);
  });
  renderOverview(overviewFiltered);
}

function exportOverviewCSV(){
  var monthHeaders = monthOrder.map(function(mi){return 'Views ('+D.month_labels[mi]+'),UU ('+D.month_labels[mi]+')';}).join(',');
  var csv = ['#,Title,URL,'+monthHeaders].concat(
    overviewFiltered.map(function(r,i){
      var cols=monthOrder.map(function(mi){return fmtN(r.views[mi])+','+fmtN(r.uu[mi]);}).join(',');
      return (i+1)+',"'+r.title.replace(/"/g,'""')+'","'+r.url+'",'+cols;
    })
  ).join('\n');
  downloadCSV(csv, 'gva_top_pages_'+D.month_labels[D.month_labels.length-1].replace(/ /g,'_').toLowerCase()+'.csv');
}

function downloadCSV(content, filename){
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(content);
  a.download = filename;
  a.click();
}

// ─── CATEGORY PANELS (multi-month array data) ───
const sortState = {};
// display order: newest month first
const monthOrder = Array.from({length: D.month_labels.length}, function(_,i){ return D.month_labels.length-1-i; });

buildOverviewHead();
renderOverview(overviewFiltered);
document.getElementById('overviewCount').textContent = overviewData.length+' pages';

function renderCat(id){
  const panel = document.getElementById('p_'+id);
  if(panel.dataset.rendered) return;

  const cat = D.categories.find(c=>c.replace(/[^a-zA-Z0-9]/g,'_')===id);
  const allRows = D.category_data[cat] || [];
  const n = D.month_labels.length;

  if(!allRows.length){
    panel.innerHTML = '<div class="empty-panel"><div class="ei">&#128194;</div><div>No asset data available for this category.</div></div>';
    panel.dataset.rendered='1';
    return;
  }

  const tv = allRows.reduce(function(s,r){return s+r.views[n-1];},0);
  const tu = allRows.reduce(function(s,r){return s+r.uu[n-1];},0);
  sortState[id] = {col:'views', idx:n-1, dir:1};

  // Build month-group header cells
  var mhCells = '<th rowspan="2" style="width:44px;text-align:center;cursor:default">#</th><th rowspan="2">Asset Title</th>';
  monthOrder.forEach(function(mi){
    var ml = D.month_labels[mi];
    var bdr = mi>0 ? ' style="border-right:2px solid rgba(255,255,255,0.15)"' : '';
    mhCells += '<th colspan="2"'+bdr+'>'+ml+'</th>';
  });

  // Build sortable column header cells
  var chCells = '';
  monthOrder.forEach(function(mi){
    var bdr = mi>0 ? ' style="border-right:2px solid rgba(255,255,255,0.1)"' : '';
    chCells += '<th onclick="sortCat(\''+id+'\',\'views\','+mi+')" id="thv_'+id+'_'+mi+'">Views &#x21D5;</th>';
    chCells += '<th onclick="sortCat(\''+id+'\',\'uu\','+mi+')" id="thu_'+id+'_'+mi+'"'+bdr+'>UU &#x21D5;</th>';
  });
  var totalCols = 2 + n*2;

  panel.innerHTML =
    '<div class="cat-stats">'+
      '<div class="cat-kpi"><div class="lbl">Assets</div><div class="val">'+allRows.length+'</div></div>'+
      '<div class="cat-kpi"><div class="lbl">Views ('+D.month_labels[n-1]+')</div><div class="val">'+tv.toLocaleString()+'</div></div>'+
      '<div class="cat-kpi"><div class="lbl">Unique Users ('+D.month_labels[n-1]+')</div><div class="val">'+tu.toLocaleString()+'</div></div>'+
    '</div>'+
    '<div class="toolbar">'+
      '<div class="search-wrap">'+
        '<svg class="search-icon" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#2A2D36" stroke-width="1.5"/><path d="M10 10L14 14" stroke="#2A2D36" stroke-width="1.5" stroke-linecap="round"/></svg>'+
        '<input type="text" placeholder="Search assets\u2026" oninput="filterCat(\''+id+'\', this.value)" id="search_'+id+'">'+
      '</div>'+
      '<button class="btn-export" onclick="exportCatCSV(\''+id+'\')">'+
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        ' Export CSV'+
      '</button>'+
      '<span class="filter-count" id="count_'+id+'">'+allRows.length+' assets</span>'+
    '</div>'+
    '<div class="hint">Click column header to sort &middot; Sorted by last month views</div>'+
    '<div class="table-wrap">'+
      '<table>'+
        '<thead>'+
          '<tr style="background:var(--blue-11);color:#fff">'+mhCells+'</tr>'+
          '<tr style="background:var(--blue-10);color:#fff">'+chCells+'</tr>'+
        '</thead>'+
        '<tbody id="tb_'+id+'"></tbody>'+
      '</table>'+
    '</div>';

  panel._allRows = allRows;
  panel._filtered = allRows.slice();
  drawCatRows(id);
  var defaultTh = document.getElementById('thv_'+id+'_'+(n-1));
  if(defaultTh){ defaultTh.classList.add('sorted'); defaultTh.innerHTML = defaultTh.innerHTML.replace(/[\u25BC\u25B2\u21D5]/g,'\u25BC'); }
  panel.dataset.rendered = '1';
}

function filterCat(id, q){
  const panel = document.getElementById('p_'+id);
  const allRows = panel._allRows || [];
  panel._filtered = q ? allRows.filter(r=>r.title.toLowerCase().includes(q.toLowerCase())) : allRows.slice();
  const countEl = document.getElementById('count_'+id);
  if(countEl) countEl.textContent = panel._filtered.length < allRows.length
    ? 'Showing '+panel._filtered.length+' of '+allRows.length
    : allRows.length+' assets';
  drawCatRows(id);
}

function drawCatRows(id){
  const panel = document.getElementById('p_'+id);
  const rows = panel._filtered || (panel._allRows || []);
  const s = sortState[id] || {col:'views', idx:D.month_labels.length-1, dir:1};
  const n = D.month_labels.length;
  const sorted = rows.slice().sort(function(a,b){
    var va = s.col==='views' ? a.views[s.idx] : a.uu[s.idx];
    var vb = s.col==='views' ? b.views[s.idx] : b.uu[s.idx];
    return s.dir*(vb-va);
  });
  const maxV = Math.max.apply(null, sorted.map(r=>r.views[n-1]).concat([1]));
  const tbody = document.getElementById('tb_'+id);
  if(!tbody) return;

  if(!sorted.length){
    tbody.innerHTML = '<tr><td colspan="'+(2+n*2)+'" class="no-results">No assets match your search.</td></tr>';
    return;
  }

  tbody.innerHTML = sorted.map(function(r,i){
    var rankEl = i<3 ? '<span class="rank-badge rank-'+(i+1)+'">'+(i+1)+'</span>' : '<span style="color:#9EA8B3;font-weight:600">'+(i+1)+'</span>';
    var cells = '';
    monthOrder.forEach(function(mi){
      var bdr = mi>0 ? ' style="border-right:1px solid #e8edf8"' : '';
      cells += '<td class="num">'+fmt(r.views[mi])+'</td><td class="num"'+bdr+'>'+fmt(r.uu[mi])+'</td>';
    });
    return '<tr>'+
      '<td class="rank">'+rankEl+'</td>'+
      '<td class="link-cell">'+
        '<a class="link-title" href="'+r.url+'" target="_blank" title="'+r.title+'">'+r.title+'</a>'+
        '<span class="bar-mini" style="width:'+Math.round(r.views[n-1]/maxV*280)+'px"></span>'+
      '</td>'+
      cells+
    '</tr>';
  }).join('');
}

function sortCat(id, col, idx){
  const s = sortState[id];
  if(s.col===col && s.idx===idx) s.dir*=-1; else{s.col=col; s.idx=idx; s.dir=1;}
  const n = D.month_labels.length;
  D.month_labels.forEach(function(_,mi){
    var thv = document.getElementById('thv_'+id+'_'+mi);
    var thu = document.getElementById('thu_'+id+'_'+mi);
    if(thv){ thv.classList.remove('sorted'); thv.innerHTML=thv.innerHTML.replace(/[\u25BC\u25B2\u21D5]/g,'\u21D5'); }
    if(thu){ thu.classList.remove('sorted'); thu.innerHTML=thu.innerHTML.replace(/[\u25BC\u25B2\u21D5]/g,'\u21D5'); }
  });
  var activeId = (col==='views'?'thv_':'thu_')+id+'_'+idx;
  var active = document.getElementById(activeId);
  if(active){ active.classList.add('sorted'); active.innerHTML=active.innerHTML.replace(/[\u25BC\u25B2\u21D5]/g, s.dir===1?'\u25BC':'\u25B2'); }
  drawCatRows(id);
}

function exportCatCSV(id){
  const panel = document.getElementById('p_'+id);
  const cat = D.categories.find(c=>c.replace(/[^a-zA-Z0-9]/g,'_')===id);
  const rows = panel._filtered || panel._allRows || [];
  const s = sortState[id] || {col:'views', idx:D.month_labels.length-1, dir:1};
  const n = D.month_labels.length;
  const sorted = rows.slice().sort(function(a,b){
    var va = s.col==='views' ? a.views[s.idx] : a.uu[s.idx];
    var vb = s.col==='views' ? b.views[s.idx] : b.uu[s.idx];
    return s.dir*(vb-va);
  });
  var monthHeaders = monthOrder.map(function(mi){ return 'Views ('+D.month_labels[mi]+'),UU ('+D.month_labels[mi]+')'; }).join(',');
  var csv = ['#,Title,URL,'+monthHeaders].concat(
    sorted.map(function(r,i){
      var monthCols = monthOrder.map(function(mi){ return fmtN(r.views[mi])+','+fmtN(r.uu[mi]); }).join(',');
      return (i+1)+',"'+r.title.replace(/"/g,'""')+'","'+r.url+'",'+monthCols;
    })
  ).join('\n');
  downloadCSV(csv, 'gva_'+id+'_'+D.month_labels[n-1].replace(/ /g,'_').toLowerCase()+'.csv');
}
